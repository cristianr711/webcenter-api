<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | System Failure</title>
    <link rel="icon" href="imagenes/logo.webp" type="image/webp">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #050a14;
            --cyan: #00e5ff;
            --red: #ff0055;
            --white: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-dark);
            color: var(--white);
            font-family: 'Montserrat', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* --- FONDO DE REJILLA CIBERNÉTICA --- */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: 
                linear-gradient(transparent 95%, rgba(0, 229, 255, 0.1) 95%),
                linear-gradient(90deg, transparent 95%, rgba(0, 229, 255, 0.1) 95%);
            background-size: 30px 30px;
            pointer-events: none;
            z-index: -1;
        }

        /* --- EFECTO SCANLINE (CRT) --- */
        body::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        .container {
            text-align: center;
            z-index: 10;
            padding: 20px;
        }

        /* --- TEXTO GLITCH GIGANTE --- */
        .glitch {
            font-size: 10rem;
            font-weight: 900;
            position: relative;
            color: var(--white);
            letter-spacing: -5px;
            text-shadow: 2px 2px 0px var(--cyan);
        }

        .glitch::before,
        .glitch::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .glitch::before {
            left: 2px;
            text-shadow: -1px 0 #ff0055;
            clip: rect(24px, 550px, 90px, 0);
            animation: glitch-anim-2 3s infinite linear alternate-reverse;
        }

        .glitch::after {
            left: -2px;
            text-shadow: -1px 0 #00e5ff;
            clip: rect(85px, 550px, 140px, 0);
            animation: glitch-anim 2.5s infinite linear alternate-reverse;
        }

        /* --- TEXTOS SECUNDARIOS --- */
        h2 {
            font-size: 2rem;
            margin-top: -20px;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 5px;
            color: var(--cyan);
        }

        p {
            font-size: 1.1rem;
            color: #aaa;
            max-width: 600px;
            margin: 0 auto 40px auto;
            line-height: 1.5;
        }

        /* --- BOTÓN DE RETORNO --- */
        .btn-return {
            display: inline-block;
            padding: 15px 40px;
            background: transparent;
            color: var(--cyan);
            border: 2px solid var(--cyan);
            text-decoration: none;
            font-weight: 800;
            font-size: 1rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
            transition: 0.3s;
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.2);
        }

        .btn-return:hover {
            background: var(--cyan);
            color: #000;
            box-shadow: 0 0 40px rgba(0, 229, 255, 0.6);
        }

        /* --- ANIMACIONES KEYFRAMES --- */
        @keyframes glitch-anim {
            0% { clip: rect(10px, 9999px, 30px, 0); transform: skew(0.5deg); }
            5% { clip: rect(70px, 9999px, 20px, 0); transform: skew(0.3deg); }
            10% { clip: rect(20px, 9999px, 80px, 0); transform: skew(0.1deg); }
            15% { clip: rect(90px, 9999px, 10px, 0); transform: skew(0.8deg); }
            20% { clip: rect(10px, 9999px, 50px, 0); transform: skew(0.2deg); }
            25% { clip: rect(40px, 9999px, 20px, 0); transform: skew(0.6deg); }
            30% { clip: rect(20px, 9999px, 60px, 0); transform: skew(0.4deg); }
            35% { clip: rect(80px, 9999px, 10px, 0); transform: skew(0.9deg); }
            40% { clip: rect(30px, 9999px, 90px, 0); transform: skew(0.2deg); }
            45% { clip: rect(50px, 9999px, 30px, 0); transform: skew(0.5deg); }
            50% { clip: rect(10px, 9999px, 80px, 0); transform: skew(0.1deg); }
            55% { clip: rect(60px, 9999px, 20px, 0); transform: skew(0.7deg); }
            60% { clip: rect(20px, 9999px, 50px, 0); transform: skew(0.3deg); }
            65% { clip: rect(90px, 9999px, 10px, 0); transform: skew(0.8deg); }
            70% { clip: rect(10px, 9999px, 40px, 0); transform: skew(0.2deg); }
            75% { clip: rect(50px, 9999px, 90px, 0); transform: skew(0.6deg); }
            80% { clip: rect(30px, 9999px, 20px, 0); transform: skew(0.4deg); }
            85% { clip: rect(80px, 9999px, 60px, 0); transform: skew(0.9deg); }
            90% { clip: rect(20px, 9999px, 10px, 0); transform: skew(0.1deg); }
            95% { clip: rect(60px, 9999px, 40px, 0); transform: skew(0.5deg); }
            100% { clip: rect(10px, 9999px, 80px, 0); transform: skew(0.3deg); }
        }

        @keyframes glitch-anim-2 {
            0% { clip: rect(60px, 9999px, 10px, 0); transform: skew(0.8deg); }
            5% { clip: rect(20px, 9999px, 50px, 0); transform: skew(0.3deg); }
            10% { clip: rect(90px, 9999px, 20px, 0); transform: skew(0.7deg); }
            15% { clip: rect(10px, 9999px, 80px, 0); transform: skew(0.1deg); }
            20% { clip: rect(50px, 9999px, 30px, 0); transform: skew(0.5deg); }
            25% { clip: rect(30px, 9999px, 90px, 0); transform: skew(0.2deg); }
            30% { clip: rect(80px, 9999px, 10px, 0); transform: skew(0.9deg); }
            35% { clip: rect(20px, 9999px, 60px, 0); transform: skew(0.4deg); }
            40% { clip: rect(40px, 9999px, 20px, 0); transform: skew(0.6deg); }
            45% { clip: rect(10px, 9999px, 50px, 0); transform: skew(0.2deg); }
            50% { clip: rect(90px, 9999px, 10px, 0); transform: skew(0.8deg); }
            55% { clip: rect(20px, 9999px, 60px, 0); transform: skew(0.4deg); }
            60% { clip: rect(30px, 9999px, 20px, 0); transform: skew(0.6deg); }
            65% { clip: rect(50px, 9999px, 90px, 0); transform: skew(0.1deg); }
            70% { clip: rect(10px, 9999px, 40px, 0); transform: skew(0.5deg); }
            75% { clip: rect(20px, 9999px, 10px, 0); transform: skew(0.3deg); }
            80% { clip: rect(10px, 9999px, 80px, 0); transform: skew(0.9deg); }
            85% { clip: rect(20px, 9999px, 50px, 0); transform: skew(0.3deg); }
            90% { clip: rect(60px, 9999px, 10px, 0); transform: skew(0.8deg); }
            95% { clip: rect(30px, 9999px, 20px, 0); transform: skew(0.2deg); }
            100% { clip: rect(10px, 9999px, 40px, 0); transform: skew(0.5deg); }
        }

        /* RESPONSIVE PARA EL TEXTO GIGANTE */
        @media (max-width: 768px) {
            .glitch { font-size: 6rem; }
            h2 { font-size: 1.2rem; }
            p { font-size: 0.9rem; padding: 0 20px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 class="glitch" data-text="404">404</h1>
        
        <h2>SYSTEM FAILURE</h2>
        
        <p>
            La ruta que buscas ha sido eliminada, movida o nunca existió en este servidor. 
            <br>Verifica tus coordenadas de navegación.
        </p>

        <a href="index.html" class="btn-return">
            REINICIAR SISTEMA
        </a>
    </div>

</body>
</html>
